<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="forgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="100%" stop-color="#66B200" />
    </linearGradient>
  </defs>
  <!-- Hexagonal Athletic Shield Badge -->
  <polygon points="50,6 92,26 92,74 50,94 8,74 8,26" fill="#14171c" stroke="url(#forgeGradient)" stroke-width="7" stroke-linejoin="round"/>
  <!-- Heavy Power Barbell -->
  <path d="M32 50 H68" stroke="url(#forgeGradient)" stroke-width="8" stroke-linecap="round"/>
  <!-- Inner Barbell Plates -->
  <rect x="25" y="34" width="9" height="32" rx="3" fill="url(#forgeGradient)"/>
  <rect x="66" y="34" width="9" height="32" rx="3" fill="url(#forgeGradient)"/>
  <!-- Outer Barbell Plates -->
  <rect x="18" y="40" width="6" height="20" rx="2" fill="url(#forgeGradient)"/>
  <rect x="76" y="40" width="6" height="20" rx="2" fill="url(#forgeGradient)"/>
  <!-- Forge Power Ember -->
  <path d="M50 25 C53 35, 60 38, 50 47 C40 38, 47 35, 50 25 Z" fill="#ffffff"/>
</svg>
